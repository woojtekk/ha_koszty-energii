name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release zip
        run: |
          mkdir -p dist
          zip -r dist/koszty_energii.zip custom_components/koszty_energii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/koszty_energii.zip
